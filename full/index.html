<!doctype html>
<html lang="en" data-theme="noir" data-dark="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget &amp; Planner — Luxe</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="author" content="BudgetIdo">
<meta name="copyright" content="© BudgetIdo. All rights reserved.">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/icon-192.png" id="favicon">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" id="touchicon">
<link rel="manifest" href="manifest.webmanifest" id="manifestlink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --font-s:'Newsreader',Georgia,'Times New Roman',serif;
  --font:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F7F4EE;--surface:#fff;--surface2:#FBF9F4;--border:#ECE6DA;--track:#EFE9DE;
  --text:#1E1A24;--muted:#6E6675;
  --accent:#C8A96A;--on-accent:#1E1A24;--plum:#5B3F6B;
  --pos:#3F7D62;--neg:#A8435A;
  --side:#1E1A24;--side-text:var(--text);--side-muted:var(--muted);--side-hover:var(--accent-soft);--side-line:var(--border);--bh:0px;
  --shadow:0 1px 2px rgba(30,26,36,.04),0 8px 24px rgba(30,26,36,.06);
  --accent-hover:color-mix(in srgb,var(--accent) 80%,#000);
  --accent-text:color-mix(in srgb,var(--accent) 45%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --r:20px;--ir:12px;
}
html[data-theme=violet]{--accent:#A68BE0;--plum:#4A3478;--side:#1C1530;--bg:#F6F3FA;--border:#E6E0F0;--track:#ECE7F5;--text:#1D1830;--surface2:#FAF8FD}
html[data-theme=rose]{--accent:#D6A0B1;--plum:#7A3F58;--side:#2A1A22;--bg:#FAF4F3;--border:#F0E2E1;--track:#F4E8E7;--text:#2A1A22;--surface2:#FDF9F8}
html[data-theme=sapphire]{--accent:#7FA6E0;--plum:#2E4E8A;--side:#0F1B33;--bg:#F3F6FA;--border:#DEE5F0;--track:#E6ECF5;--text:#101A2E;--surface2:#F9FBFD}
html[data-theme=sand]{--accent:#C79660;--plum:#6B4A2B;--side:#2B2118;--bg:#F6F1E8;--border:#E9E0D0;--track:#EEE6D6;--text:#2B2118;--surface2:#FBF8F2}
html[data-dark=true]{
  --bg:#121015;--surface:#1B1820;--surface2:#211E27;--border:#2C2832;--track:#2B2733;
  --text:#F3EEE6;--muted:#A9A1B1;--pos:#6FBF9C;--neg:#E57F97;--plum:#A58BC0;
  --side:#0D0B10;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --accent-text:color-mix(in srgb,var(--accent) 88%,#fff);
  --accent-soft:color-mix(in srgb,var(--accent) 18%,var(--surface));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font:15px/1.5 var(--font);background:var(--bg);color:var(--text);min-height:100dvh;display:grid;grid-template-columns:276px minmax(0,1fr);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--font-s);font-weight:600;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
h1{font-size:clamp(1.9rem,3vw,2.5rem);line-height:1.15}
h2{font-size:1.4rem;line-height:1.25}
h3{font-size:1.1rem;line-height:1.3}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.money{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum","tnum";white-space:nowrap;text-align:right}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wrapt{min-width:0;overflow-wrap:anywhere}

/* sidebar */
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:28px 16px 18px;gap:20px;scrollbar-width:thin}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font:700 22px var(--font-s);color:var(--on-accent);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.brand b{display:block;font:600 1.05rem/1.2 var(--font-s);overflow-wrap:anywhere}
.brand small{display:block;color:var(--side-muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 14px;border-radius:999px;color:var(--side-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;transition:background .15s,color .15s}
.item span{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.item:hover{background:var(--side-hover);color:var(--side-text)}
.item[aria-current=page]{background:color-mix(in srgb,var(--accent) 72%,#fff);color:var(--on-accent);font-weight:600}
.item.has-active{color:var(--side-text)}
.item .chev{width:16px;height:16px;transition:transform .2s}
.item[aria-expanded=true] .chev{transform:rotate(180deg)}
.sub{padding:6px 6px 8px 14px;margin:2px 0 4px 22px;border-left:1px solid var(--side-line);display:flex;flex-direction:column;gap:6px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mbtn{height:36px;border-radius:10px;font-size:13px;font-weight:500;color:var(--side-muted);position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.mbtn:hover{background:var(--side-hover);color:var(--side-text)}
.mbtn[aria-current=page]{background:color-mix(in srgb,var(--accent) 72%,#fff);color:var(--on-accent);font-weight:600}
.mbtn.now::after{content:"";position:absolute;right:6px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.mbtn.now[aria-current=page]::after{background:var(--on-accent)}
.subitem{height:40px;font-size:14px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px;font-size:12.5px;color:var(--side-muted)}
.side-foot .row{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.globe{display:inline-flex;align-items:center;gap:6px;height:36px;min-width:44px;padding:0 10px;border-radius:999px;color:var(--side-text);border:1px solid var(--side-line);font-size:12px;font-weight:600;flex:none}
.globe:hover{background:var(--side-hover)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;max-width:100%;transition:background .15s,box-shadow .15s,transform .1s,border-color .15s,opacity .15s;user-select:none}
.btn span{overflow:hidden;text-overflow:ellipsis}
.btn-primary{color:var(--on-accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.15),0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-primary:hover{background:linear-gradient(180deg,var(--accent),var(--accent-hover))}
.btn-primary:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.btn-ghost-side{width:100%}
.btn-sec{border:1px solid var(--border);background:var(--surface);color:var(--text);box-shadow:0 1px 1px rgba(0,0,0,.03)}
.btn-sec:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn-sec:active{transform:translateY(1px)}
.btn-ghost{color:var(--accent-text);padding:0 12px}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-danger{color:var(--neg)}
.btn-danger:hover{background:color-mix(in srgb,var(--neg) 10%,transparent)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--accent-soft);color:var(--text)}
.icon-btn.danger:hover{color:var(--neg);background:color-mix(in srgb,var(--neg) 10%,transparent)}
@media(pointer:coarse){.btn-sm{min-height:44px}.icon-btn{width:44px;height:44px}.mbtn{height:44px}}

/* main */
main{padding:40px 36px 96px;min-width:0}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.phead{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.phead>div{min-width:0}
.phead p{color:var(--muted);margin-top:6px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;min-width:0;animation:fade .25s ease both}
.card.flush{padding:8px 24px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sechead p{color:var(--muted);font-size:14px;width:100%;margin-top:-6px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.kpi{position:relative;overflow:hidden;padding:22px 24px 22px}
.kpi::before{content:"";position:absolute;left:24px;right:24px;top:0;height:2px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.kpi .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chip{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.kpi label,.caps{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.kpi .val{font:600 clamp(1.5rem,2.2vw,1.95rem)/1.15 var(--font-s);font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum","tnum";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val.pos{color:var(--pos)}.kpi .val.neg{color:var(--neg)}
.kpi .sub2{font-size:13px;color:var(--muted);margin-top:4px}

/* pills */
.pill{display:inline-block;height:26px;line-height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;background:color-mix(in srgb,var(--pc,var(--accent)) 18%,var(--surface));color:color-mix(in srgb,var(--pc,var(--accent)) 55%,var(--text))}
button.pill{cursor:pointer;border:1px solid color-mix(in srgb,var(--pc) 30%,transparent)}
.mpills{display:flex;gap:8px;flex-wrap:wrap}
.mp{height:40px;min-width:52px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;position:relative}
.mp:hover{border-color:var(--accent);color:var(--text)}
.mp[aria-pressed=true]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--on-accent);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.mp.now::after{content:"";position:absolute;top:6px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.mp[aria-pressed=true].now::after{background:var(--on-accent)}
@media(pointer:coarse){.mp{height:44px}}

/* progress */
.prog{margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--accent)) 70%,#fff),var(--c,var(--accent)));animation:grow .5s ease both}
.bar.over i{background:linear-gradient(90deg,var(--neg),color-mix(in srgb,var(--neg) 70%,#000))}
.proglabels{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:nowrap}
.proglabels span{white-space:nowrap}
.proglabels .money{text-align:inherit}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>.lbl{font-size:12.5px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.inp,.sel select{width:100%;height:44px;border-radius:var(--ir);border:1px solid var(--border);background:var(--surface);padding:0 14px;color:var(--text);transition:border-color .15s,box-shadow .15s;min-width:0}
.inp::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.inp:hover,.sel select:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.inp:focus,.sel select:focus,textarea.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
textarea.inp{height:auto;min-height:104px;padding:12px 14px;resize:vertical;line-height:1.5}
.inp.bad{border-color:var(--neg)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 25%,transparent)!important}
.inp.money-in{text-align:left;font-variant-numeric:tabular-nums}
.sel{position:relative;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;padding-right:44px;cursor:pointer;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.sel>svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none;color:var(--muted)}
.sel select option,.sel select optgroup{background:var(--surface);color:var(--text)}
input[type=color]{appearance:none;border:0;padding:0;width:44px;height:44px;border-radius:50%;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:2px solid var(--border);border-radius:50%}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;align-items:end}
.err{color:var(--neg);font-size:13px;min-height:18px}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none;margin:-8px 0}
.chk i{width:22px;height:22px;border-radius:7px;border:1.5px solid color-mix(in srgb,var(--muted) 70%,transparent);display:grid;place-items:center;transition:.15s;background:var(--surface);color:transparent}
.chk[aria-checked=true] i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk i .ic{width:14px;height:14px;stroke-width:2.4}
.chk:hover i{border-color:var(--accent)}
.switch{width:52px;height:30px;border-radius:99px;background:var(--track);border:1px solid var(--border);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked=true]::after{left:25px}

/* lists */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .when{width:84px;flex:none;font-size:13px;color:var(--muted);white-space:nowrap}
.txr{display:grid;grid-template-columns:84px minmax(0,1fr) auto auto;grid-template-areas:"dt nm am ac";gap:12px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.done .nm{text-decoration:line-through;color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 12px;color:var(--muted)}
.empty .chip{width:52px;height:52px;border-radius:16px}.empty .chip .ic{width:24px;height:24px}
.empty p{max-width:36ch}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 9px;height:22px;line-height:22px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap;display:inline-block}

/* charts */
.chart{width:100%;min-height:120px}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px;min-width:0}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.sw.out{background:transparent;border:1.5px solid var(--c)}
.donutwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.dleg{width:100%;display:flex;flex-direction:column}
.dleg .li{padding:8px 0;font-size:13.5px}
.stacked{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--track);gap:2px}
.stacked i{display:block;min-width:3px;background:var(--c);animation:grow .5s ease both}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--side);color:#fff;font-size:12.5px;line-height:1.45;padding:8px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:240px;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}.tip b{display:block}
[data-tip]{cursor:default}

/* envelopes / log */
.env .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.env .budrow{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start;margin:12px 0 8px}
.env .budrow .inp{text-align:left}
.logrow{display:grid;grid-template-columns:84px 170px minmax(0,1fr) 120px auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--border)}
.logrow:first-child{border-top:0}
.logrow .acts{display:flex}
.toolbar{display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(3,minmax(140px,1fr));gap:12px}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
.searchbox .inp{padding-left:42px}
table.t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
table.t th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:10px 8px;border-bottom:1px solid var(--border)}
table.t td{padding:11px 8px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.t th:first-child,table.t td:first-child{text-align:left;width:26%}
table.t tr.tot td{font-weight:700;border-bottom:0;background:var(--surface2)}
.tablewrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day{aspect-ratio:1/1;min-height:52px;border-radius:14px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;font-weight:600;font-size:14px;position:relative}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.4}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}

      const diff=dayNum(first)-dayNum(st);if(diff>0)k=Math.ceil(diff/step);
      for(let d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+k*step);d<=lastD;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+step))if(d>=st&&d>=first)out.push(mk(ev,d))}
    else if(r==='monthly'){if(y*12+m>=st.getFullYear()*12+st.getMonth())out.push(mk(ev,new Date(y,m,Math.min(st.getDate(),last))))}
    else if(r==='yearly'){if(st.getMonth()===m&&y>=st.getFullYear())out.push(mk(ev,new Date(y,m,Math.min(st.getDate(),last))))}}
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ev.name<b.ev.name?-1:1))}
function upcomingFrom(from,n,kinds){const d=parse(from),out=[];
  for(let i=0;i<4&&out.length<n;i++){const dt=new Date(d.getFullYear(),d.getMonth()+i,1);
    out.push(...occMonth(dt.getFullYear(),dt.getMonth()).filter(o=>o.date>=from&&!o.done&&(!kinds||kinds.includes(o.ev.kind))))}
  return out.slice(0,n)}
function toggleDone(evId,date){const ev=S.events.find(e=>e.id===evId);if(!ev)return;ev.done=ev.done||{};const key=evId+'|'+date;
  if(ev.done[date]){delete ev.done[date];S.tx=S.tx.filter(x=>!(x.ev===key&&x.auto))}
  else{ev.done[date]=true;const ref=ev.kind==='income'?'income':ev.ref;
    if(ev.kind!=='note'&&ref&&ev.amt>0&&!S.tx.some(x=>x.ev===key))S.tx.push({id:uid(),date,type:typeOfRef(ref),ref:ref==='income'?null:ref,name:ev.name,amt:ev.amt,ev:key,auto:true})}}

/* debt payoff simulation (order + rollover) */
function debtOrder(){const L=S.debts.map(d=>({d,bal:debtLeft(d)}));
  L.sort((a,b)=>(a.bal===0)-(b.bal===0)||(S.strategy==='snowball'?a.bal-b.bal:b.d.rate-a.d.rate||a.bal-b.bal));return L}
function debtPlan(){const L=debtOrder(),res={},bal={};L.forEach(x=>{bal[x.d.id]=x.bal;if(x.bal<=0)res[x.d.id]=0});
  const pool=sum(S.debts.map(d=>d.pay||0));
  for(let mo=1;mo<=600;mo++){let any=false;
    L.forEach(x=>{if(bal[x.d.id]>0){bal[x.d.id]+=bal[x.d.id]*(x.d.rate||0)/1200;any=true}});
    if(!any)break;let p=pool;
    L.forEach(x=>{const d=x.d;if(bal[d.id]>0){const a=Math.min(bal[d.id],d.pay||0,p);bal[d.id]-=a;p-=a}});
    for(const x of L){if(p<=0)break;const d=x.d;if(bal[d.id]>0){const a=Math.min(bal[d.id],p);bal[d.id]-=a;p-=a}}
    L.forEach(x=>{if(bal[x.d.id]<=0.005&&res[x.d.id]===undefined){res[x.d.id]=mo;bal[x.d.id]=0}});
    if(L.every(x=>res[x.d.id]!==undefined))break}
  return{L,res}}

let CH={};
const rtop=(x,y,w,h,r)=>{r=Math.min(r,w/2,h);return`M${x},${y+h}L${x},${y+r}Q${x},${y} ${x+r},${y}L${x+w-r},${y}Q${x+w},${y} ${x+w},${y+r}L${x+w},${y+h}Z`};
const tipAttr=h=>`data-tip="${esc(h)}"`;
function barChart(el,d){
  const W=Math.max(240,el.clientWidth||320),H=240,pb=30,pt=8,n=d.groups.length,colW=W/n;
  const mx=Math.max(1,...d.groups.flatMap(g=>[g.a,g.b])),step=Math.pow(10,Math.floor(Math.log10(mx))),ymax=Math.ceil(mx/step*2)/2*step||1;
  const ch=H-pb-pt,Y=v=>pt+ch-(v/ymax)*ch,bw=Math.max(6,Math.min(16,colW*.24)),gap=4;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.label)}" height="${H}">`;
  for(let i=0;i<=4;i++){const y=pt+ch*i/4;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="${i===4?'0':'3 4'}"/>`}
  d.groups.forEach((g,i)=>{const cx=colW*i+colW/2,x1=cx-bw-gap/2,x2=cx+gap/2;
    const ha=g.a/ymax*ch,hb=g.b/ymax*ch;
    if(g.a>0)s+=`<path d="${rtop(x1,Y(g.a),bw,Math.max(2,ha),5)}" fill="${d.ca}" fill-opacity="${d.caOp??1}" stroke="${d.caStroke||'none'}" stroke-width="1.5"/>`;
    if(g.b>0)s+=`<path d="${rtop(x2,Y(g.b),bw,Math.max(2,hb),5)}" fill="${g.color||d.cb}"/>`;
    const max=Math.max(2,Math.floor(colW/6.6)),lab=colW<30?g.label.slice(0,1):(g.label.length>max?g.label.slice(0,max-1)+'…':g.label);
    s+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="11.5" fill="var(--muted)" font-family="'Hanken Grotesk',system-ui,sans-serif">${esc(lab)}</text>`;
    s+=`<rect x="${colW*i}" y="0" width="${colW}" height="${H-pb+14}" fill="transparent" tabindex="0" aria-label="${esc(g.label+': '+d.na+' '+money(g.a)+', '+d.nb+' '+money(g.b))}" ${tipAttr(`<b>${esc(g.label)}</b>${esc(d.na)}: ${money(g.a)}<br>${esc(d.nb)}: ${money(g.b)}`)}/>`});
  el.innerHTML=s+'</svg>'}
function donut(el,d){
  const size=Math.min(200,Math.max(150,el.clientWidth||200)),r=size/2-14,C=2*Math.PI*r,tot=sum(d.parts.map(p=>p.v));
  let s=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(d.label)}" style="max-width:100%;margin:0 auto"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="20"/>`;
  let off=0;if(tot>0)d.parts.forEach(p=>{const len=p.v/tot*C,gap=d.parts.length>1?Math.min(3,len/3):0;
    s+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.color}" stroke-width="20" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" tabindex="0" aria-label="${esc(p.name+' '+money(p.v))}" ${tipAttr(`<b>${esc(p.name)}</b>${money(p.v)} · ${Math.round(p.v/tot*100)}%`)}/>`;off+=len});
  s+=`<text x="50%" y="${size/2-4}" text-anchor="middle" font-size="11" letter-spacing=".08em" fill="var(--muted)" font-family="'Hanken Grotesk',sans-serif">${esc(d.center.toUpperCase())}</text><text x="50%" y="${size/2+18}" text-anchor="middle" font-size="${size<170?15:17}" font-weight="600" fill="var(--text)" font-family="'Newsreader',Georgia,serif" style="font-variant-numeric:lining-nums tabular-nums">${money(tot)}</text></svg>`;
  el.innerHTML=s}

function groupTop(items,max,otherColor='#8D8794'){const L=items.filter(x=>x.v>0||x.b>0).sort((a,b)=>Math.max(b.v||0,b.b||0)-Math.max(a.v||0,a.b||0));

function logRows(){let L=S.tx.slice();if(ui.lm>=0)L=L.filter(x=>x.date.startsWith(S.year+'-'+pad(ui.lm+1)+'-'));
  if(ui.lt!=='all')L=L.filter(x=>x.type===ui.lt);if(ui.lc!=='all')L=L.filter(x=>x.ref===ui.lc);
  const q=ui.lq.trim().toLowerCase();if(q)L=L.filter(x=>(x.name+' '+(x.note||'')+' '+(ent(x.ref)?.name||'')+' '+x.amt).toLowerCase().includes(q));
  const s=ui.ls;L.sort((a,b)=>s==='dd'?byDate(b,a):s==='da'?byDate(a,b):s==='ad'?b.amt-a.amt:a.amt-b.amt);return L}
const typeColor=x=>x.type==='income'?'var(--pos)':(ent(x.ref)?.color||'var(--accent)');
const catName=x=>x.type==='income'?t('t_income'):(ent(x.ref)?.name||'—');
function logArea(){const L=logRows(),sp=L.filter(x=>x.type!=='income'),tot=sum(sp.map(x=>x.amt));
  return`<div class="kpis"><div class="card kpi t4"><div class="top"><span class="chip">${ic('list')}</span><label>${esc(t('txCount'))}</label></div><div class="val" data-int="${L.length}">${L.length}</div></div>${kpi('wallet',t('totalTracked'),tot,'',2)}${kpi('bars',t('avgTx'),sp.length?tot/sp.length:0,'',5)}</div>
  <div class="card ${L.length?'flush':''}">${L.length?L.map(x=>`<div class="logrow"><span class="d ell">${esc(shortD(x.date))}</span><span class="p">${x.type==="income"?"":cIco(ent(x.ref))}${pill(catName(x),typeColor(x))}</span><span class="n" style="min-width:0"><span class="nm ell" style="display:block" title="${esc(x.name)}">${esc(x.name)}</span>${x.note?`<small class="muted ell" style="display:block" title="${esc(x.note)}">${esc(x.note)}</small>`:''}</span><span class="a money ${x.type==='income'?'pos':''}">${x.type==='income'?'+':''}${money(x.amt)}</span><span class="acts"><button class="icon-btn" data-act="txedit" data-id="${x.id}" aria-label="${esc(t('edit'))}">${ic('edit')}</button><button class="icon-btn danger" data-act="txdel" data-id="${x.id}" aria-label="${esc(t('del'))}">${ic('trash')}</button></span></div>`).join(''):empty('inbox',t('emptyLog'),btn(t('track'),'track','','btn-primary btn-sm','plus'))}</div>`}
function pgLog(){
  const catOpts=opt('all',t('allCats'),ui.lc)+[...S.cats,...S.debts,...S.funds].map(c=>opt(c.id,c.name,ui.lc)).join('');

  ${sel('data-chg="lt" aria-label="'+esc(t('type'))+'"',opt('all',t('allTypes'),ui.lt)+['spend','income','debt','save'].map(k=>opt(k,t('t_'+k),ui.lt)).join(''))}

   `<button data-act="navopen" ${['setup','goals','savings','debt','settings'].includes(ui.page)?'aria-current="page"':''}>${ic('grid')}<span>${esc(t('nav_more'))}</span></button>`}
function lum(hex){const n=parseInt(hex.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
/* theme-aware favicon / app icon */
const mixW=(h,p)=>{const n=parseInt(h.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(255-v)*p));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')};
function iconSvg(){const th=THEMES.find(h=>h[0]===S.theme)||THEMES[2],ac=(S.custom&&/^#[0-9a-f]{6}$/i.test(S.custom))?S.custom:th[2],fg=S.custom?(lum(ac)>.35?'#2A1A22':'#fff'):th[3];
  return`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mixW(ac,.55)}"/><stop offset="1" stop-color="${ac}"/></linearGradient></defs><rect width="512" height="512" fill="url(#g)"/><text x="256" y="352" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="300" fill="${fg}">B</text></svg>`}
let iconKey='';
function updateIcons(){try{const svg=iconSvg();if(svg===iconKey)return;iconKey=svg;
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  const fav=$('#favicon');fav.type='image/svg+xml';fav.href=url;
  const img=new Image();img.onload=()=>{try{const png=(n)=>{const c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(img,0,0,n,n);return c.toDataURL('image/png')};
    $('#touchicon').href=png(180);
    if(location.protocol.startsWith('http')){const th=THEMES.find(h=>h[0]===S.theme)||THEMES[2],ac=S.custom||th[2],base=location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'');
      const man={name:'Budget & Planner',short_name:'Budget',description:'A calm, private budget planner.',id:base,start_url:base,scope:base,display:'standalone',orientation:'portrait-primary',background_color:th[4],theme_color:ac,categories:['finance','productivity'],icons:[{src:png(192),sizes:'192x192',type:'image/png',purpose:'any'},{src:png(512),sizes:'512x512',type:'image/png',purpose:'any'},{src:png(512),sizes:'512x512',type:'image/png',purpose:'maskable'}]};
      $('#manifestlink').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}))}}catch(e){}};
  img.src=url}catch(e){}}
function applyTheme(){const h=document.documentElement;h.dataset.theme=S.theme;h.dataset.dark=String(!!S.dark);h.lang=S.lang;h.classList.toggle('demo',DEMO_MODE);h.dataset.side=S.sideMini?'mini':'';
  if(S.custom&&/^#[0-9a-f]{6}$/i.test(S.custom)){h.style.setProperty('--accent',S.custom);h.style.setProperty('--on-accent',lum(S.custom)>.35?'#1E1A24':'#fff')}
  else{h.style.removeProperty('--accent');h.style.removeProperty('--on-accent')}
  $('meta[name=theme-color]').setAttribute('content',S.dark?'#1B1820':'#FFFFFF');updateIcons()}
const openNav=()=>{document.body.classList.add('nav-open');const b=$('#topbar [data-act=navopen]');b&&b.setAttribute('aria-expanded','true')};

/* ============ render ============ */
let lastAct=null;
function render(){
  applyTheme();fmtInit();CH={};
  const y=window.scrollY;
  $('#side').innerHTML=sideHtml();$('#tabbar').innerHTML=tabHtml();$('#topbar').innerHTML=topbarHtml();const db=$('#demobar');db.hidden=!DEMO_MODE;if(DEMO_MODE)db.innerHTML=demoHtml();
  let html;try{html=PAGES[ui.page]()}catch(e){console.error(e);html=`<div class="card">⚠ ${esc(e.message)}</div>`}
  $('#main').innerHTML=`<div class="wrap">${html}<footer class="copy">© ${new Date().getFullYear()} <b>BudgetIdo</b> · ${esc(t('rights'))}</footer></div>`;
  document.title=`${t('nav_'+ui.page)} · Budget & Planner`;$('#fab').hidden=!['home','today','env','log'].includes(ui.page);
  drawCharts();
  if(ui.anim&&!reduceMotion)animateCounts();ui.anim=false;
  window.scrollTo(0,y);
  if(lastAct){const el=$(`#main [data-act="${lastAct.a}"][data-id="${lastAct.id}"]`)||$(`#main [data-act="${lastAct.a}"][data-ev="${lastAct.ev}"][data-d="${lastAct.d}"]`);if(el)el.focus({preventScroll:true});lastAct=null}
}
function animateCounts(){$$('[data-count],[data-int]').forEach(el=>{const isInt=el.dataset.int!==undefined,end=Number(isInt?el.dataset.int:el.dataset.count);if(!end)return;const t0=performance.now(),D=650;
  const step=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,3),v=end*e;el.textContent=isInt?Math.round(v):money(v);if(p<1)requestAnimationFrame(step);else el.textContent=isInt?end:money(end)};requestAnimationFrame(step)})}
const commit=(anim=false)=>{save();ui.anim=anim;render();if(!DEMO_MODE&&Date.now()>=(toast.until||0))toast(t('saved'),1600)};
function toast(msg,ms=2200){toast.until=Date.now()+ms;const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),ms)}

/* ============ routing ============ */
function go(page,arg){
  if(!PAGES[page])page='home';
  if(page==='env'&&arg!==undefined&&arg!=='')ui.em=clampMonth(+arg);
  const h='#/'+page+(page==='env'?'/'+ui.em:'');
  if(location.hash!==h)history.pushState(null,'',h);
  ui.page=page;if(['env','yearly','log'].includes(page))ui.envOpen=true;ui.anim=true;closeModal();closeNav();render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function readHash(){const p=(location.hash||'').replace(/^#\/?/,'').split('/');const page=PAGES[p[0]]?p[0]:'home';ui.page=page;if(page==='env'&&p[1]!==undefined)ui.em=clampMonth(+p[1]||0)}
window.addEventListener('popstate',()=>{readHash();ui.anim=true;if(!(modalEl&&modalEl.dataset.lock))closeModal();render()});

function confirmBox(msg,onYes,label){openModal(`<h2>${esc(t('confirm'))}</h2><p>${esc(msg)}</p><div class="acts"><button class="btn btn-sec" data-act="modclose">${esc(t('cancel'))}</button><button class="btn btn-primary" id="yesBtn" data-autofocus>${esc(label||t('del'))}</button></div>`);
  $('#yesBtn').onclick=()=>{closeModal();onYes()}}
function openLang(){openModal(`<div class="mh"><h2>${esc(t('chooseLang'))}</h2><button class="icon-btn" data-act="modclose" aria-label="${esc(t('close'))}">${ic('x')}</button></div><div role="radiogroup">${LANGS.map(l=>`<button class="opt" role="radio" aria-checked="${S.lang===l[0]}" data-act="setlang" data-v="${l[0]}">${esc(l[1])}${S.lang===l[0]?ic('check'):''}</button>`).join('')}</div>`)}
const txEnvOpts=(type,cur)=>(type==='spend'?S.cats:type==='debt'?S.debts:S.funds).map(c=>opt(c.id,c.name,cur)).join('');
function openTx(o={}){
  const edit=!!o.id,type=o.type||(S.cats.length?'spend':'income'),list=type==='spend'?S.cats:type==='debt'?S.debts:S.funds,ref=o.ref||(list[0]||{}).id||'';
  closeNav();
  openModal(`<form data-form="tx" class="stack" style="gap:16px"><div class="mh"><h2>${esc(edit?t('editTx'):t('trackT'))}</h2><button type="button" class="icon-btn" data-act="modclose" aria-label="${esc(t('close'))}">${ic('x')}</button></div>
   <input type="hidden" name="id" value="${esc(o.id||'')}">
   ${field(t('amount'),`<input class="inp bigamt" name="amt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${o.amt?String(o.amt):''}" data-autofocus aria-describedby="txErr">`)}
   ${field(t('category'),sel('name="type" data-chg="txtype"',['spend','debt','save','income'].map(k=>opt(k,t('t_'+k),type)).join('')))}
   <div id="txEnvWrap" ${type==='income'?'hidden':''}>${field(t('envelope'),sel('name="ref"',txEnvOpts(type,ref)))}</div>
   ${field(t('nameOpt'),`<input class="inp" name="name" maxlength="80" autocomplete="off" placeholder="${esc(type==='income'?t('paycheck'):'')}" value="${esc(o.name||'')}">`)}
   ${field(t('date'),`<input class="inp" type="date" name="date" value="${esc(o.date||todayS())}" required>`)}
   ${field(t('notesOpt'),`<textarea class="inp" name="note" maxlength="300" style="min-height:76px">${esc(o.note||'')}</textarea>`)}
   <div class="err" id="txErr" role="alert"></div>
   <div class="acts"><span class="muted noprint" style="margin-right:auto;font-size:12.5px;align-self:center">${esc(t('hint'))}</span><button type="button" class="btn btn-sec" data-act="modclose">${esc(t('cancel'))}</button><button class="btn btn-primary" type="submit">${esc(edit?t('save'):t('add'))}</button></div></form>`)}
function openInstall(){

/* ============ CSV / backup ============ */
function download(name,text,mime){const b=new Blob([text],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCsv(){const q=v=>{v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n;]/.test(v)||v!==String(v).trim()?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[[t('date'),t('type'),t('category'),t('name'),t('amount'),t('note')].map(q).join(',')];
  logRows().sort(byDate).forEach(x=>rows.push([x.date,t('t_'+x.type),catName(x),x.name,(Math.round(x.amt*100)/100).toFixed(2),x.note||''].map(q).join(',')));
  download(`transactions-${ui.lm<0?S.year:S.year+'-'+pad(ui.lm+1)}.csv`,'﻿'+rows.join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download(`budget-planner-backup-${todayS()}.json`,JSON.stringify(S,null,2),'application/json')}
function restoreFile(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!Array.isArray(o.tx)||!Array.isArray(o.cats))throw 0;S=norm(o);fmtInit();commit(true);toast(t('restored'))}catch(e){toast(t('badFile'))}};r.readAsText(file)}
function clearData(keepPrefs){const p=keepPrefs?{user:S.user,lang:S.lang,cur:S.cur,theme:S.theme,dark:S.dark,custom:S.custom}:{};
  S=norm(p);S.cats=['Rent / Mortgage','Utilities','Groceries','Dining Out','Transportation','Health & Fitness','Entertainment','Miscellaneous'].map((n,i)=>({id:'c_'+uid(),name:n,color:['#7A5C8E','#C79A3F','#5E8C7B','#B9694F','#5F7FA6','#4F9189','#6C74B5','#8D8794'][i]}));S.demo=false;if(!keepPrefs)S.lang=guessLang()}

    ev.repeat&&ev.repeat!=='none'?confirmBox(t('delSeries')+'?',run):run()},
  nospend:()=>{const d=todayS();if(S.nospend[d])delete S.nospend[d];else S.nospend[d]=true;commit()},
  strat:()=>{},
  print:()=>window.print(),
  csv:()=>DEMO_MODE?0:exportCsv(),
  backup:()=>DEMO_MODE?0:backup(),
  restore:()=>DEMO_MODE?0:$('#fileIn').click(),
  erase:()=>DEMO_MODE?0:confirmBox(t('eraseConfirm'),()=>{if(!DEMO_MODE)try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_own')}catch(e){}clearData(false);S.onboarded=false;ui.page='setup';history.replaceState(null,'','#/setup');commit(true);toast(t('erased'));openWelcome()},t('erase')),
  welcomeDemo:()=>{if(!S.demo){const keep={user:S.user,lang:S.lang,cur:S.cur,theme:S.theme,dark:S.dark,custom:S.custom,sideMini:S.sideMini};S=buildDemo();Object.assign(S,keep);S.demo=true}S.onboarded=true;closeModal();fmtInit();commit(true)},
  demotoggle:()=>{const keep={user:S.user,lang:S.lang,cur:S.cur,theme:S.theme,dark:S.dark,custom:S.custom,sideMini:S.sideMini};
    if(!S.demo){try{localStorage.setItem(KEY+'_own',JSON.stringify(S))}catch(e){}S=buildDemo();Object.assign(S,keep);S.demo=true}
    else{let own=null;try{own=JSON.parse(localStorage.getItem(KEY+'_own'))}catch(e){}
      if(own&&Array.isArray(own.tx)){S=norm(own);Object.assign(S,keep)}else clearData(true);S.demo=false}
    S.onboarded=true;fmtInit();commit(true);toast(t(S.demo?'demoSwOn':'demoSwOff'))},
  cleardemo:()=>confirmBox(t('clearConfirm'),()=>{clearData(true);S.onboarded=false;commit(true);toast(t('cleared'));openWelcome()},t('clearDemo')),
  sidemini:()=>{S.sideMini=!S.sideMini;commit()},
  navopen:()=>openNav(),navclose:()=>closeNav(),
  install:async()=>{closeNav();if(deferredInstall){const d=deferredInstall;deferredInstall=null;d.prompt();try{const r=await d.userChoice;if(r.outcome==='accepted')installed=true}catch(e){}render()}else openInstall()},

const FORMS={
  welcome:(fd)=>{const name=String(fd.get('user')||'').trim();if(!name)return;const cur=String(fd.get('cur')||S.cur);
    clearData(true);S.user=name;if(CURRENCIES.includes(cur))S.cur=cur;S.onboarded=true;S.demo=false;fmtInit();closeModal();ui.anim=true;save();go('setup');toast(t('saved'))},
  tx:(fd,f)=>{const amt=num(fd.get('amt'));if(!(amt>0)){$('#txErr',f).textContent=t('amtErr');$('[name=amt]',f).focus();return}
    const type=fd.get('type'),ref=type==='income'?'':fd.get('ref');if(type!=='income'&&!ref){$('#txErr',f).textContent=t('needEnv');return}
    const date=fd.get('date')||todayS();let name=(fd.get('name')||'').trim();if(!name)name=type==='income'?t('t_income'):(ent(ref)?.name||'');
    const o={date,type,ref:type==='income'?null:ref,name,amt:Math.round(amt*100)/100,note:(fd.get('note')||'').trim()},id=fd.get('id');
    if(id){const x=S.tx.find(v=>v.id===id);if(x)Object.assign(x,o)}else S.tx.push({id:uid(),...o});
    closeModal();toast(t('saved'));commit()},
  envIncome:(fd)=>{const amt=num(fd.get('amt'));if(!(amt>0))return;S.tx.push({id:uid(),date:defDate(ui.em),type:'income',ref:null,name:(fd.get('name')||'').trim()||t('paycheck'),amt});toast(t('saved'));commit()},
  envSpend:(fd)=>{const amt=num(fd.get('amt'));if(!(amt>0))return;const [type,ref]=String(fd.get('target')).split('|');if(!ref)return;S.tx.push({id:uid(),date:defDate(ui.em),type,ref,name:(fd.get('name')||'').trim()||ent(ref).name,amt});toast(t('saved'));commit()},
  addEnv:(fd)=>{const name=(fd.get('name')||'').trim();if(!name)return;const pal=['#7A5C8E','#C79A3F','#5E8C7B','#B9694F','#5F7FA6','#A9627A','#6C74B5','#4F9189'];const id='c_'+uid();S.cats.push({id,name,color:pal[S.cats.length%pal.length]});S.bud[id]=Array(12).fill(Math.max(0,num(fd.get('bud'))));commit()},
  goal:(fd)=>{const name=(fd.get('name')||'').trim();if(!name)return;const id=fd.get('id'),date=fd.get('date')||'',status=+fd.get('status')||0;const g=id&&S.goals.find(v=>v.id===id);if(g)Object.assign(g,{name,date,status});else S.goals.push({id:uid(),name,status,date});closeModal();toast(t('saved'));commit()},
  addFund:(fd)=>{const name=(fd.get('name')||'').trim();if(!name)return;const pal=['#4F6FA3','#3F8F8F','#6A5BA8','#B58A3C','#A9627A'];const id='f_'+uid();S.funds.push({id,name,goal:Math.max(0,num(fd.get('goal'))),start:Math.max(0,num(fd.get('start'))),date:fd.get('date')||'',color:pal[S.funds.length%pal.length]});S.bud[id]=Array(12).fill(0);commit()},
  addDebt:(fd)=>{const name=(fd.get('name')||'').trim();if(!name)return;const pal=['#A8435A','#8E4A62','#B5707F','#7A3F58'];const id='d_'+uid();S.debts.push({id,name,balance:Math.max(0,num(fd.get('balance'))),rate:Math.max(0,num(fd.get('rate'))),pay:Math.max(0,num(fd.get('pay'))),color:pal[S.debts.length%pal.length]});S.bud[id]=Array(12).fill(Math.max(0,num(fd.get('pay'))));commit()},
  addEvent:(fd)=>{const name=(fd.get('name')||'').trim();if(!name)return;const kind=fd.get('kind'),[,ref]=String(fd.get('target')).split('|');const date=fd.get('date')||ui.cd;
    S.events.push({id:uid(),name,date,amt:Math.max(0,num(fd.get('amt'))),kind,ref:kind==='income'?'income':(ref||''),repeat:fd.get('repeat')||'none',done:{}});
    const d=parse(date);ui.cy=d.getFullYear();ui.cm=d.getMonth();ui.cd=date;toast(t('saved'));commit()}
};
/* input guards: number fields take digits and one decimal point only (no letters, no minus) */
const cleanNum=v=>{let x=String(v).replace(/[^\d.,]/g,'').replace(',','.');const i=x.indexOf('.');if(i>=0)x=x.slice(0,i+1)+x.slice(i+1).replace(/\./g,'');const [a,b]=x.split('.');return b===undefined?a.slice(0,10):a.slice(0,10)+'.'+b.slice(0,2)};
const flagBad=el=>{el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),600)};
document.addEventListener('beforeinput',e=>{const el=e.target;if(!el.classList||!el.classList.contains('money-in'))return;
  if(e.inputType&&e.inputType.startsWith('insert')&&e.data!=null&&/[^\d.,]/.test(e.data)){e.preventDefault();flagBad(el)}});
document.addEventListener('input',e=>{const el=e.target;if(!el.classList||!el.classList.contains('money-in'))return;
  const c=cleanNum(el.value);if(c!==el.value){const pos=Math.max(0,(el.selectionStart||0)-(el.value.length-c.length));el.value=c;try{el.setSelectionRange(pos,pos)}catch(_){}flagBad(el)}el.setCustomValidity('')});
const badField=(el,msg)=>{el.setCustomValidity(msg);el.reportValidity();el.addEventListener('input',()=>el.setCustomValidity(''),{once:true});return false};
function validForm(f){for(const el of f.querySelectorAll('input.inp')){if(el.type==='hidden'||el.disabled)continue;
  if(el.classList.contains('money-in')){if((el.required||el.name==='amt')&&!(num(el.value)>0))return badField(el,t('errAmount'))}
  else if(el.required&&el.type==='text'&&!el.value.trim())return badField(el,t('errName'))}return true}
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(!validForm(f))return;const fn=FORMS[f.dataset.form];if(fn){fn(new FormData(f),f);if(modalEl&&!modalEl.dataset.lock&&modalEl.contains(f))closeModal()}});

/* tooltips (hover, focus, tap) */
const tip=$('#tip');let tipT;
function showTip(el,x,y){tip.innerHTML=el.dataset.tip;tip.classList.add('on');const r=tip.getBoundingClientRect();let l=x+14,tp=y+14;if(l+r.width>innerWidth-8)l=x-r.width-14;if(l<8)l=8;if(tp+r.height>innerHeight-8)tp=y-r.height-14;tip.style.left=l+'px';tip.style.top=Math.max(8,tp)+'px'}
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&e.pointerType!=='touch')showTip(el,e.clientX,e.clientY);else if(e.pointerType!=='touch')tip.classList.remove('on')});
document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');if(el&&(e.pointerType==='touch'||matchMedia('(pointer:coarse)').matches)){showTip(el,e.clientX,e.clientY);clearTimeout(tipT);tipT=setTimeout(()=>tip.classList.remove('on'),2600)}else if(!el)tip.classList.remove('on')});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}});
document.addEventListener('focusout',()=>tip.classList.remove('on'));

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalEl){if(!modalEl.dataset.lock)closeModal();return}
  if(e.key==='Escape'&&document.body.classList.contains('nav-open')){closeNav();return}
  if(modalEl&&e.key==='Tab'){const f=$$('button:not([disabled]),input:not([type=hidden]),select,textarea,[href]',modalEl).filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  if((e.key==='n'||e.key==='N')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!modalEl&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')&&!(document.activeElement||{}).isContentEditable){e.preventDefault();ACT.track()}});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;render()});
window.addEventListener('appinstalled',()=>{installed=true;deferredInstall=null;render()});
matchMedia('(display-mode: standalone)').addEventListener&&matchMedia('(display-mode: standalone)').addEventListener('change',()=>render());
window.addEventListener('offline',()=>{toast(t('offline'),4200)});
if(!navigator.onLine)setTimeout(()=>toast(t('offline'),4200),600);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
